[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doctrap"
version = "0.1.0"
description = "DocTrap - AI document security gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "python-docx>=1.1",
  "pymupdf>=1.24",
  "scikit-learn>=1.4",
  "reportlab>=4.1",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "lxml>=5.2",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
packages = ["doctrap_ui"]
py-modules = [
  "models", "db", "ingestion", "pdf_parser", "docx_parser",
  "pdf_forensics", "docx_forensics", "unicode_inspect", "normalize",
  "rules", "ml_classifier", "context", "scoring", "workflow", "sanitizer",
  "pipeline", "rag_indexer", "llm", "lab", "evaluation", "app"
]

[tool.setuptools.package-data]
doctrap_ui = ["dist/index.html", "dist/assets/*"]
